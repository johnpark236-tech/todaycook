name: Generate static Korean recipe audio

on:
  push:
    branches: [main]
    paths:
      - 'data/recipes-fallback.json'
      - 'tools/generate_static_tts.py'
      - '.github/workflows/generate-static-tts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg mecab libmecab-dev mecab-ipadic-utf8

      - name: Install Python dependencies
        run: pip install numpy soundfile python-mecab-ko onnxruntime huggingface_hub

      - name: Generate Korean MP3 files
        run: python tools/generate_static_tts.py

      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio
          if git diff --cached --quiet; then
            echo "No audio changes."
          else
            git commit -m "feat(tts): generate static Korean recipe audio"
            git push
          fi
