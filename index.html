<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff6b35">
  <meta name="description" content="오늘 먹을 간식을 쉽고 빠르게 고르고, 단계별 레시피와 한국어 음성 안내로 따라 할 수 있는 모바일 간식 앱.">
  <meta property="og:title" content="오늘 뭐먹지?">
  <meta property="og:description" content="초보자도 쉽게 만드는 오늘의 간식 레시피">
  <meta property="og:type" content="website">
  <title>오늘 뭐먹지? · 간식편 | 쉬운 간식 레시피</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/logo/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="splash" class="splash" aria-hidden="true">
    <img src="assets/logo/logo.svg" alt="" width="92" height="92">
    <h1>오늘 뭐먹지?</h1>
    <p>오늘은 어떤 간식이 당길까요?</p>
  </div>
  <div class="app-shell">
    <header class="topbar">
      <a href="#/home" class="brand" aria-label="홈으로">
        <img src="assets/logo/logo.svg" alt="" width="40" height="40">
        <span>오늘 뭐먹지?</span>
      </a>
      <button class="icon-button" id="surprise-button" type="button" aria-label="무작위 메뉴 추천">🎲</button>
    </header>
    <main id="app" tabindex="-1" aria-live="polite">
      <div class="loading-card"><span class="spinner"></span><p>맛있는 간식을 준비하고 있어요</p></div>
    </main>
    <nav class="bottom-nav" aria-label="주요 메뉴">
      <a href="#/home" data-route="home"><span aria-hidden="true">⌂</span><b>홈</b></a>
      <a href="#/recipes" data-route="recipes"><span aria-hidden="true">⌕</span><b>간식 찾기</b></a>
      <a href="#/shopping" data-route="shopping"><span aria-hidden="true">🛒</span><b>장보기</b></a>
      <a href="#/ingredients" data-route="ingredients"><span aria-hidden="true">🥬</span><b>재료 찾기</b></a>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/shopping.js"></script>
  <script src="js/ingredients.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
